<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration — Prestalia</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="logo" href="index.html"><span class="logo-mark">P</span>Prestalia · Admin</a>
      <div class="nav">
        <span id="who" class="muted"></span>
        <button id="logout" class="btn btn-outline btn-sm" hidden>Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="wrap admin">
    <p id="notice" class="notice" hidden></p>

    <section id="login" class="card login" hidden>
      <h1 class="h2">Espace administrateur</h1>
      <p>Connectez-vous avec le compte Google autorisé pour modifier le site.</p>
      <button id="login-btn" class="btn btn-red">Se connecter avec Google</button>
    </section>

    <div id="app" hidden>
      <nav class="tabs" role="tablist">
        <button data-tab="profil" class="active">Profil & contact</button>
        <button data-tab="services">Services</button>
        <button data-tab="parcours">Parcours</button>
        <button data-tab="atouts">Compétences & langues</button>
        <button data-tab="messages">Messages <span id="unread" class="badge" hidden></span></button>
      </nav>

      <form id="editor">
        <section data-panel="profil" class="panel card">
          <h2>Photo</h2>
          <div class="photo-row">
            <img id="photo-preview" src="assets/photo.jpg" alt="Photo actuelle" width="120" height="144">
            <label class="btn btn-outline btn-sm">Changer la photo<input id="photo-input" type="file" accept="image/*" hidden></label>
          </div>
          <h2>Identité</h2>
          <label>Nom<input name="name"></label>
          <label>Métier / accroche principale<input name="title"></label>
          <label>Phrase d'accueil<input name="tagline"></label>
          <label>Naissance / origine<input name="birth"></label>
          <label>Présentation<textarea name="about" rows="6"></textarea></label>
          <h2>Contact</h2>
          <label>Adresse<input name="address"></label>
          <label>Téléphones (un par ligne)<textarea name="phones" rows="3"></textarea></label>
          <label>Email<input name="email" type="email"></label>
          <label>Numéro WhatsApp (avec indicatif, ex. 2290197900204)<input name="whatsapp"></label>
        </section>

        <section data-panel="services" class="panel card" hidden>
          <h2>Services proposés</h2>
          <div id="services-ed" class="items"></div>
          <button type="button" class="btn btn-outline btn-sm" data-add="services">+ Ajouter un service</button>
        </section>

        <section data-panel="parcours" class="panel card" hidden>
          <h2>Expériences (de la plus récente à la plus ancienne)</h2>
          <div id="experiences-ed" class="items"></div>
          <button type="button" class="btn btn-outline btn-sm" data-add="experiences">+ Ajouter une expérience</button>
        </section>

        <section data-panel="atouts" class="panel card" hidden>
          <h2>Compétences</h2>
          <label>Une compétence par ligne<textarea name="skills" rows="8"></textarea></label>
          <h2>Langues</h2>
          <label>Une langue par ligne, au format « Langue — Niveau »<textarea name="languages" rows="6"></textarea></label>
          <h2>Centres d'intérêt</h2>
          <label>Un par ligne<textarea name="interests" rows="5"></textarea></label>
        </section>

        <section data-panel="messages" class="panel card" hidden>
          <h2>Messages reçus</h2>
          <div id="messages"></div>
        </section>

        <div class="savebar">
          <button type="button" id="cv-preview" class="btn btn-outline">Télécharger le CV (aperçu)</button>
          <button type="submit" class="btn btn-red">Enregistrer les modifications</button>
          <span id="save-status" role="status"></span>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
